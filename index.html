<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e5a8a">
  <title>Lagio</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">

  <!-- Import map: tells the browser where library names point to,
       so code can write `import { h } from 'preact'`. All files are local. -->
  <script type="importmap">
    {
      "imports": {
        "preact": "./vendor/preact.module.js",
        "preact/hooks": "./vendor/hooks.module.js",
        "htm": "./vendor/htm.module.js",
        "jszip": "./vendor/jszip.js",
        "pdfjs": "./vendor/pdfjs/pdf.min.mjs"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Preact draws the whole app inside this element (see js/app.js) -->
  <div id="app"></div>
</body>
</html>
